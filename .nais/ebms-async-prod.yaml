apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: "ebms-async"
  namespace: "team-emottak"
  labels:
    "team": "team-emottak"
spec:
  leaderElection: true
  azure:
    application:
      enabled: true
  webproxy: true
  image: {{image}}
  liveness:
    path: "/internal/health/liveness"
    port: 8080
    initialDelay: 30
    timeout: 10
    failureThreshold: 10
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
      destinations:
        - id: "grafana-lgtm"
        - id: "elastic-apm"
    logging:
      destinations:
        - id: elastic
        - id: loki
  readiness:
    path: "/internal/health/readiness"
    port: 8080
    initialDelay: 30
    timeout: 10
    failureThreshold: 10
  prometheus:
    enabled: true
    path: /prometheus
  replicas:
    scalingStrategy:
      cpu:
        thresholdPercentage: 30
    min: 1
    max: 1
  resources:
    limits:
      memory: "1536Mi"
    requests:
      cpu: "150m"
      memory: "1536Mi"
  ingresses:
    - "https://ebms-async-fss.intern.nav.no"
  vault:
    enabled: true
  kafka:
    pool: nav-prod
  accessPolicy:
    outbound:
      rules:
        - application: ebms-async
        - application: cpa-repo
        - application: ebms-payload
        - application: ebms-send-in
        - application: smtp-transport
    inbound:
      rules:
        - application: ebms-async
        - application: smtp-transport
  env:
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MaxRAMPercentage=75.0"
    - name: TZ
      value: Europe/Oslo
    - name: VIRKSOMHETSSERTIFIKAT_PATH
      value: /secret/virksomhetssertifikat/prod/Arbeids-og-velferdsetaten
    - name: VIRKSOMHETSSERTIFIKAT_SIGNERING_2022
      value: key.p12.b64.2022
    - name: VIRKSOMHETSSERTIFIKAT_DEKRYPTERING_2022
      value: key.decrypt.p12.b64.2022
    - name: VIRKSOMHETSSERTIFIKAT_CREDENTIALS_2022
      value: credentials.2022
    - name: VIRKSOMHETSSERTIFIKAT_SIGNERING_2025
      value: key.p12.b64.2025
    - name: VIRKSOMHETSSERTIFIKAT_DEKRYPTERING_2025
      value: key.decrypt.p12.b64.2025
    - name: VIRKSOMHETSSERTIFIKAT_CREDENTIALS_2025
      value: credentials.2025
    - name: MAX_CONNECTION_POOL_SIZE_FOR_USER
      value: "4"
    - name: MAX_CONNECTION_POOL_SIZE_FOR_ADMIN
      value: "1"
    - name: EBMS_SIGNAL_RECEIVER
      value: "true"
    - name: EBMS_SIGNAL_PRODUCER
      value: "true"
    - name: EBMS_PAYLOAD_RECEIVER
      value: "true"
    - name: EBMS_PAYLOAD_PRODUCER
      value: "true"
    - name: EBMS_IN_PAYLOAD_PRODUCER
      value: "true"
    - name: EBMS_OUT_PAYLOAD_RECEIVER
      value: "true"
    - name: EBMS_RETRY_QUEUE
      value: "true"
    - name: EBMS_RETRY_OUT_QUEUE
      value: "true"
    - name: VAULT_JDBC_URL
      value: jdbc:postgresql://A01DBVL037.adeo.no:5432/
    - name: CPA_REPO_URL
      value: http://cpa-repo.team-emottak.svc.nais.local
    - name: PAYLOAD_PROCESSOR_URL
      value: http://ebms-payload
    - name: SEND_IN_URL
      value: http://ebms-send-in
    - name: SMTP_TRANSPORT_URL
      value: http://smtp-transport

  envFrom:
    - configmap: ebms-async-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ebms-async-leader-discovery
  namespace: team-emottak
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ebms-async-leader-discovery
  namespace: team-emottak
subjects:
  - kind: ServiceAccount
    name: ebms-async
    namespace: team-emottak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ebms-async-leader-discovery
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ebms-async-background-jobs
  namespace: team-emottak
  labels:
    team: team-emottak
spec:
  groups:
    - name: ebms-async-background-jobs
      rules:
        - alert: EbmsAsyncBackgroundLeaderUnavailable
          expr: |
            sum(background_job_leader{namespace="team-emottak",app="ebms-async"}) != 1
            or absent(background_job_leader{namespace="team-emottak",app="ebms-async"})
          for: 5m
          labels:
            namespace: team-emottak
            severity: warning
          annotations:
            summary: ebms-async does not report exactly one background-job leader
            consequence: Scheduled retries and ACK resends may not run.
            action: Check elector and pod health. A stuck elected pod must be deleted, not only restarted.
            runbook_url: https://github.com/navikt/ebxml-processor/blob/main/docs/ebms-async-operations.md
        - alert: EbmsAsyncBackgroundJobStalled
          expr: |
            background_job_active{namespace="team-emottak",app="ebms-async"} == 1
            and time() - background_job_last_progress_seconds{namespace="team-emottak",app="ebms-async"} > 300
          for: 1m
          labels:
            namespace: team-emottak
            severity: warning
          annotations:
            summary: An active ebms-async background job is not making progress
            consequence: Retry or ACK-resend processing is stalled.
            action: Inspect downstream calls, job errors and leader health before considering pod deletion.
            runbook_url: https://github.com/navikt/ebxml-processor/blob/main/docs/ebms-async-operations.md
