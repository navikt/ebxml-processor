kafka {
  groupId = "ebms-payload"
}

helseId {
    nhnUrl = "https://helseid-sts.test.nhn.no"
    openIdConfigCacheTimeInSec = 600
    issuerDefaultValue = "https://helseid-sts.test.nhn.no"
    jwksUrlDefaultValue = "https://helseid-sts.test.nhn.no/.well-known/openid-configuration/jwks"
    allowedClockSkewInMs = 1000
    allowedMessageGenerationGapInMs = 10000
}

signering = [
  {
    type = "FILE"
    path = "${KEYSTORE_FILE_SIGN_2025}"
    fileResource = "${KEYSTORE_FILE_SIGN_2025}"
    passResource = "${KEYSTORE_PWD_2025}"
    keyStoreType = "PKCS12"
  }
]

dekryptering = [
  {
    type = "FILE"
    path = "${KEYSTORE_FILE_DEKRYPT_2025}"
    fileResource = "${KEYSTORE_FILE_DEKRYPT_2025}"
    passResource = "${KEYSTORE_PWD_2025}"
    keyStoreType = "PKCS12"
  }
]
