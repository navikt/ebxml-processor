kafka {
  groupId = "ebms-payload"
}

helseId {
  nhnUrl = "https://helseid-sts.test.nhn.no"
  openIdConfigCacheTimeInSec = 600
  issuerDefaultValue = "https://helseid-sts.test.nhn.no"
  jwksUrlDefaultValue = "https://helseid-sts.test.nhn.no/.well-known/openid-configuration/jwks"
  allowedClockSkewInMs = 1000
  allowedMessageGenerationGapInMs = 10000
}

signering = [
  {
    type = "FILE"
    path = "${KEYSTORE_FILE_SIGN:-keystore/test_keystore2024.p12}"
    fileResource = "${KEYSTORE_FILE_SIGN:-keystore/test_keystore2024.p12}"
    passResource = "${KEYSTORE_PWD:-123456789}"
    keyStoreType = "${KEYSTORE_TYPE:-PKCS12}"
  }
]

dekryptering = [
  {
    type = "FILE"
    path = "${KEYSTORE_FILE_DEKRYPT:-xml/signering_keystore.p12}"
    fileResource = "${KEYSTORE_FILE_DEKRYPT:-xml/signering_keystore.p12}"
    passResource = "${KEYSTORE_PWD:-123456789}"
    keyStoreType = "${KEYSTORE_TYPE:-PKCS12}"
  }
]
