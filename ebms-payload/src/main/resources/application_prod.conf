kafka {
  groupId = "ebms-payload"
}

helseId {
    nhnUrl = "https://helseid-sts.nhn.no"
    openIdConfigCacheTimeInSec = 600
    issuerDefaultValue = "https://helseid-sts.nhn.no"
    jwksUrlDefaultValue = "https://helseid-sts.nhn.no/.well-known/openid-configuration/jwks"
    allowedClockSkewInMs = 1000
    allowedMessageGenerationGapInMs = 10000
}

signering = [
  {
    type = "VAULT"
    path = "${VIRKSOMHETSSERTIFIKAT_PATH}"
    fileResource = "${VIRKSOMHETSSERTIFIKAT_SIGNERING_2022}"
    passResource = "${VIRKSOMHETSSERTIFIKAT_CREDENTIALS_2022}"
    keyStoreType = "PKCS12"
  },
  {
    type = "VAULT"
    path = "${VIRKSOMHETSSERTIFIKAT_PATH}"
    fileResource = "${VIRKSOMHETSSERTIFIKAT_SIGNERING_2025}"
    passResource = "${VIRKSOMHETSSERTIFIKAT_CREDENTIALS_2025}"
    keyStoreType = "PKCS12"
  }
]

dekryptering = [
  {
    type = "VAULT"
    path = "${VIRKSOMHETSSERTIFIKAT_PATH}"
    fileResource = "${VIRKSOMHETSSERTIFIKAT_DEKRYPTERING_2022}"
    passResource = "${VIRKSOMHETSSERTIFIKAT_CREDENTIALS_2022}"
    keyStoreType = "PKCS12"
  },
  {
    type = "VAULT"
    path = "${VIRKSOMHETSSERTIFIKAT_PATH}"
    fileResource = "${VIRKSOMHETSSERTIFIKAT_DEKRYPTERING_2025}"
    passResource = "${VIRKSOMHETSSERTIFIKAT_CREDENTIALS_2025}"
    keyStoreType = "PKCS12"
  }
]
