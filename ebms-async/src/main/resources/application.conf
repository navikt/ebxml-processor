kafkaLocal {
  bootstrapServers = "${KAFKA_BROKERS:-http://localhost:9092}"
  securityProtocol = "SSL"
  keystoreType = "PKCS12"
  keystoreLocation = "${KAFKA_KEYSTORE_PATH:-}"
  keystorePassword = "${KAFKA_CREDSTORE_PASSWORD:-}"
  truststoreType = "JKS"
  truststoreLocation = "${KAFKA_TRUSTSTORE_PATH:-}"
  truststorePassword = "${KAFKA_CREDSTORE_PASSWORD:-}"
  groupId = "ebms-async"
  maxPollRecords = "${MAX_POLL_RECORDS:-50}"
}

kafka {
  groupId = "ebms-async"
  maxPollRecords = "${MAX_POLL_RECORDS:-50}"
}

kafkaErrorQueue {
  active = "${EBMS_RETRY_QUEUE:-false}"
  topic = "team-emottak.ebxml.retry"
  initOffset = "${RETRY_INIT_OFFSET:-latest}"
}

kafkaErrorQueueOut {
  active = "${EBMS_RETRY_OUT_QUEUE:-false}"
  topic = "team-emottak.ebxml.retry.out"
  initOffset = "${RETRY_OUT_INIT_OFFSET:-latest}"
}

errorRetryPolicyIncoming {
  startupDelay = "${SCHEDULED_PROCESS_STARTDELAY:-5m}"
  processInterval = "${RETRY_PROCESS_INTERVAL:-5m}"
  maxMessagesToProcess = "${RETRY_PROCESS_MAX_MESSAGES:-50}"
  retryIntervals = "${RETRY_INTERVALS:-30m,1h,3h,6h,12h}"
  retriesPerInterval = "${RETRY_INTERVALS_NUMBERS:-2,2,1,3,6}"
  maxRetries = "${RETRY_IN_MAX_TIMES:-14}"
}

errorRetryPolicyOutgoing {
  startupDelay = "${SCHEDULED_PROCESS_STARTDELAY:-5m}"
  processInterval = "${RETRY_PROCESS_INTERVAL:-5m}"
  maxMessagesToProcess = "${RETRY_PROCESS_MAX_MESSAGES:-50}"
  retryIntervals = "${RETRY_INTERVALS:-30m,1h,3h,6h,12h}"
  retriesPerInterval = "${RETRY_INTERVALS_NUMBERS:-2,2,1,3,6}"
  maxRetries = "${RETRY_OUT_MAX_TIMES:-14}"
}

messageResendPolicy {
  startupDelay = "${SCHEDULED_PROCESS_STARTDELAY:-5m}"
  processInterval = "${RESEND_PROCESS_INTERVAL:-1h}"
  resendInterval = "${RESEND_INTERVAL:-12h}"
  maxResends = "${RESEND_MAX_TIMES:-4}"
}

cleanupPayloadsJob {
  enabled = "${CLEANUP_PAYLOADS_ENABLED:-false}"
  fixedInterval = "${CLEANUP_PAYLOADS_INTERVAL:-1d}"
  startAtTime = "${CLEANUP_PAYLOADS_START_AT_TIME:-00:00}"
  keepPayloadsDays = "${CLEANUP_PAYLOADS_KEEP_DAYS:-90}"
  batchSize = "${CLEANUP_PAYLOADS_BATCH_SIZE:-10000}"
}
